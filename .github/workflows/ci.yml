name: CI
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release's check run, only superseded PR pushes
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # Runs take ~3 min; GitHub's default is 6 hours
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # `npm run eslint` applies --fix, which would silently fix auto-fixable errors in CI
      - run: npx eslint --max-warnings 0 src .storybook vite.config.ts vitest.shims.d.ts
      - run: npm run prettier:check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
